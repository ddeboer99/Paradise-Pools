name: Deploy Cloudflare Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SITE_INDEXABLE: 'false'
      # Real form delivery is a separate setup and testing step.
      PUBLIC_TURNSTILE_SITE_KEY: ''
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use the project's Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test handlers and build the noindex preview
        run: |
          npm test
          npm run build
          npm run check:site
          npm run check:media
      - name: Check deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = '64e413eaba62d42bb00be7504dffad0f' || { echo 'Expected Dan’s Cloudflare account'; exit 1; }
      - name: Deploy static files and Pages Functions
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.160.1'
          command: pages deploy dist --project-name=paradise-pools-dan-preview --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the deployed preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/check-deployed-preview.mjs "$DEPLOYMENT_URL"
